{% extends "base.html" %}
{% block content %}
<div class="doku-head">
  <h1>Doku</h1>
  <a class="btn" href="/doku/edit">✏ Bearbeiten</a>
</div>

{% if saved %}
<div class="card ok">✓ Gespeichert.</div>
{% endif %}

<div class="card doku-body">
  {{ doku_html | safe }}
</div>

<style>
.doku-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.doku-body h1, .doku-body h2, .doku-body h3, .doku-body h4 { margin: 18px 0 8px; }
.doku-body h1 { font-size: 22px; } .doku-body h2 { font-size: 19px; } .doku-body h3 { font-size: 16px; }
.doku-body p { margin: 8px 0; line-height: 1.6; }
.doku-body ul, .doku-body ol { margin: 8px 0 8px 22px; }
.doku-body li { margin: 4px 0; }
.doku-body pre { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 14px; overflow-x: auto; margin: 10px 0; }
.doku-body pre code { background: none; padding: 0; font-size: 13px; }
.doku-body code { background: var(--panel2); padding: 1px 6px; border-radius: 4px; font-size: 13px; }
.doku-body a { color: var(--primary); }
</style>
{% endblock %}
